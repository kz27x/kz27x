name: Atualizar painel

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
  push:
    paths: ["assets/portrait.txt", "scripts/build_dashboard.py"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gerar painel
        env:
          GH_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_dashboard.py
      - name: Salvar
        run: |
          git config user.name "zarpa-bot"
          git config user.email "bot@users.noreply.github.com"
          git add assets/dashboard.svg
          git diff --staged --quiet || git commit -m "painel: atualização diária" && git push
